name: Generate exact Intranet dependency locks

on:
  pull_request:
    paths:
      - '.github/workflows/intranet-lock-generation.yml'
      - 'scripts/intranet-lock-generation.py'
      - 'scripts/test_intranet_lock_generation.py'
      - 'scripts/intranet-lock-policy.json'
      - 'scripts/intranet-qualified-project.json'
      - 'scripts/intranet-pruning-inputs.json'

permissions:
  contents: read

jobs:
  generate-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      DOTNET_PROCESSOR_COUNT: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out qualified Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 4517cf16f5f1159318e184969732d46eae4a8308
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out exact CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Install exact qualified SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Verify offline lock rejection controls and snapshot exact inputs
        run: |
          export INTRANET_SELECTED_SDK="$(timeout --signal=TERM --kill-after=5s 30s dotnet --version)"
          test "$INTRANET_SELECTED_SDK" = "10.0.401"
          echo "INTRANET_SELECTED_SDK=$INTRANET_SELECTED_SDK" >> "$GITHUB_ENV"
          python3 -B scripts/test_intranet_lock_generation.py
          python3 -B scripts/intranet-lock-generation.py prepare
      - name: Generate actual consumer and producer locks sequentially
        run: |
          export GITHUB_ACTIONS=false
          # Only this disposable generation phase reevaluates locks.
          export INTRANET_SELECTED_SDK="$(timeout --signal=TERM --kill-after=5s 30s dotnet --version)"
          test "$INTRANET_SELECTED_SDK" = "10.0.401"
          python3 -B scripts/intranet-lock-generation.py inputs
          timeout --signal=TERM --kill-after=20s 5m dotnet restore Legacy.Maliev.Intranet/Legacy.Maliev.Intranet.csproj --force-evaluate --use-lock-file --warnaserror -p:UseLocalMalievDependencies=true -p:PrunePackageDataRoot="$DOTNET_ROOT/sdk/10.0.401/PrunePackageData" -p:PrunePackageTargetingPackRoots="$DOTNET_ROOT/packs" -p:RestoreLockedMode=false
          export INTRANET_SELECTED_SDK="$(timeout --signal=TERM --kill-after=5s 30s dotnet --version)"
          test "$INTRANET_SELECTED_SDK" = "10.0.401"
          python3 -B scripts/intranet-lock-generation.py inputs
          timeout --signal=TERM --kill-after=20s 5m dotnet restore Legacy.Maliev.Intranet.Bff/Legacy.Maliev.Intranet.Bff.csproj --force-evaluate --use-lock-file --warnaserror -p:UseLocalMalievDependencies=true -p:PrunePackageDataRoot="$DOTNET_ROOT/sdk/10.0.401/PrunePackageData" -p:PrunePackageTargetingPackRoots="$DOTNET_ROOT/packs" -p:RestoreLockedMode=false
      - name: Reject unexpected changes and retain real raw lock bytes
        run: python3 -B scripts/intranet-lock-generation.py retain
      - name: Require both generated graphs to restore in strict locked mode
        run: |
          export GITHUB_ACTIONS=false
          export INTRANET_SELECTED_SDK="$(timeout --signal=TERM --kill-after=5s 30s dotnet --version)"
          test "$INTRANET_SELECTED_SDK" = "10.0.401"
          python3 -B scripts/intranet-lock-generation.py inputs
          timeout --signal=TERM --kill-after=20s 5m dotnet restore Legacy.Maliev.Intranet/Legacy.Maliev.Intranet.csproj --locked-mode --warnaserror -p:UseLocalMalievDependencies=true -p:PrunePackageDataRoot="$DOTNET_ROOT/sdk/10.0.401/PrunePackageData" -p:PrunePackageTargetingPackRoots="$DOTNET_ROOT/packs"
          export INTRANET_SELECTED_SDK="$(timeout --signal=TERM --kill-after=5s 30s dotnet --version)"
          test "$INTRANET_SELECTED_SDK" = "10.0.401"
          python3 -B scripts/intranet-lock-generation.py inputs
          timeout --signal=TERM --kill-after=20s 5m dotnet restore Legacy.Maliev.Intranet.Bff/Legacy.Maliev.Intranet.Bff.csproj --locked-mode --warnaserror -p:UseLocalMalievDependencies=true -p:PrunePackageDataRoot="$DOTNET_ROOT/sdk/10.0.401/PrunePackageData" -p:PrunePackageTargetingPackRoots="$DOTNET_ROOT/packs"
          python3 -B scripts/intranet-lock-generation.py verified
      - name: Retain rejected raw generation evidence without admitting changes
        if: failure()
        run: python3 -B scripts/intranet-lock-generation.py rejected
      - name: Retain generated locks and exact-source receipt before cleanup
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intranet-generated-locks-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intranet-lock-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Clean exact job-owned custody after retaining evidence
        if: always() && steps.upload.outcome == 'success'
        run: python3 -B scripts/intranet-lock-generation.py cleanup
      - name: Report failed retention and finite job expiry
        if: always() && steps.upload.outcome != 'success'
        run: echo 'Artifact retention failed; raw job-local evidence preserved until finite hosted job/runner expiry. No acceptance or preservation claim.' >> "$GITHUB_STEP_SUMMARY"
