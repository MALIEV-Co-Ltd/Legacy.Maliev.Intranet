name: Supplier Catalog persistence proof

on:
  push:
    branches: [main]
    paths:
      - 'acceptance/SupplierCatalogPersistence/**'
      - '.github/workflows/supplier-catalog-persistence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'acceptance/SupplierCatalogPersistence/**'
      - '.github/workflows/supplier-catalog-persistence.yml'

permissions:
  contents: read

concurrency:
  group: supplier-catalog-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supplier-catalog-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      DOTNET_PROCESSOR_COUNT: '2'
      LEGACY_DEPLOY_ENABLED: 'false'
    steps:
      - name: Check out exact Intranet candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out reviewed Catalog lookup producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CatalogService
          ref: 3f426723743570a6c20d2c014499445abb0774e1
          path: .dependencies/Legacy.Maliev.CatalogService
          persist-credentials: false
      - name: Check out reviewed Procurement writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ProcurementService
          ref: 614a157ab5c8739c144554797a387c45990ba7fe
          path: .dependencies/Legacy.Maliev.ProcurementService
          persist-credentials: false
      - name: Check out reviewed ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7b3099bf67d0f17e56cfdb3dcf36541304abaac2
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out reviewed CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 99529ad665503b227184c0baa946ad4e62db978a
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Verify disposable hosted runtime
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker info > /dev/null
      - name: Validate evidence rejection controls
        run: python3 -B acceptance/SupplierCatalogPersistence/test_retain.py
      - name: Build real joined programs without weakening warnings or audit
        id: build
        run: |
          export GITHUB_ACTIONS=false
          dotnet build acceptance/SupplierCatalogPersistence/SupplierCatalogPersistence.AcceptanceTests.csproj -c Release --warnaserror -p:UseLocalMalievDependencies=true --nologo
      - name: Verify focused formatting and dependency vulnerabilities
        run: |
          export GITHUB_ACTIONS=false
          dotnet format acceptance/SupplierCatalogPersistence/SupplierCatalogPersistence.AcceptanceTests.csproj --verify-no-changes --no-restore --include acceptance/SupplierCatalogPersistence/SupplierCatalogPersistenceTests.cs
          dotnet list acceptance/SupplierCatalogPersistence/SupplierCatalogPersistence.AcceptanceTests.csproj package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/supplier-audit.json"
          python3 -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"supplier-audit.json").read_text()); assert not any(p.get("vulnerabilities") for project in d.get("projects",[]) for f in project.get("frameworks",[]) for k in ("topLevelPackages","transitivePackages") for p in f.get(k,[])), "Vulnerable acceptance dependency"'
      - name: Install Chromium
        id: chromium
        run: pwsh -NoProfile -File acceptance/SupplierCatalogPersistence/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Exercise real Catalog selection, supplier save, API readback and reload
        id: proof
        timeout-minutes: 8
        run: |
          export GITHUB_ACTIONS=false
          dotnet test acceptance/SupplierCatalogPersistence/SupplierCatalogPersistence.AcceptanceTests.csproj -c Release --no-build --no-restore -p:UseLocalMalievDependencies=true --logger 'trx;LogFileName=supplier-persistence.trx' --results-directory "$RUNNER_TEMP/supplier-persistence-results" --nologo
      - name: Retain actual named result and immutable source graph
        if: always()
        env:
          PROOF_RESULTS: ${{ runner.temp }}/supplier-persistence-results
          PROOF_EVIDENCE: ${{ runner.temp }}/supplier-persistence-evidence
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EXECUTION_OUTCOME: ${{ steps.proof.outcome }}
        run: python3 -B acceptance/SupplierCatalogPersistence/retain.py
      - name: Upload sanitized proof only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supplier-catalog-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supplier-persistence-evidence/proof.json
          if-no-files-found: error
          retention-days: 7
