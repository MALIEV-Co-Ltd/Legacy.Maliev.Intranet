name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
    steps:
      - name: Check out Intranet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact CustomerService revision contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CustomerService
          ref: cebf45e8e1eeb600d760a565f8b0970c7f434148
          path: .dependencies/Legacy.Maliev.CustomerService
          persist-credentials: false
      - name: Check out exact AuthService login contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          ref: 8319b23e8ffab0c85b66c886a0109f7dac034c6f
          path: .dependencies/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Verify Docker integration-test runtime
        run: docker info
      - name: Install Playwright Chromium
        shell: bash
        run: |
          dotnet restore Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj
          dotnet build Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --configuration Release \
            --no-restore
          pwsh -NoProfile -File Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/playwright.ps1 \
            install --with-deps chromium
      - name: Diagnose current-main pooled lifecycle and order presentation
        id: current_main_diagnostics
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          dotnet build Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release -warnaserror -p:UseLocalMalievDependencies=true --nologo
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter 'FullyQualifiedName~PooledTestHostReleaseContractTests|FullyQualifiedName~TestHostLimiterDisposalContractTests|FullyQualifiedName~OrderInitialStatusHttpTests' \
            --logger 'console;verbosity=normal'
      - name: Capture bounded synthetic pooled-host root metadata after validation failure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.current_main_diagnostics.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          GITHUB_ACTIONS: 'false'
          GITHUB_TOKEN: ''
          REVIEWED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/diagnostics/pooled-host-root-evidence.py --self-test
          mkdir -p isolated-pool-results
          python3 scripts/diagnostics/pooled-host-root-evidence.py \
            --workspace "$GITHUB_WORKSPACE" \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --head "$REVIEWED_PR_HEAD" > isolated-pool-results/root-metadata.json
      - name: Preserve allowlisted synthetic pooled-host root metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intranet-isolated-pool-${{ github.sha }}
          path: isolated-pool-results/root-metadata.json
          retention-days: 3
          if-no-files-found: warn
      - name: Require current-main diagnostic regressions
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.current_main_diagnostics.outcome }}
        run: test "$DIAGNOSTIC_OUTCOME" = success
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@d7efac266bc66273bc45eab583618871292ecbd6
        env:
          # The shared action tests solution projects concurrently by default. Keep the
          # Playwright fixture isolated from the long-running integration test host.
          DOTNET_PROCESSOR_COUNT: '1'
          GITHUB_TOKEN: ${{ github.token }}
        with:
          solution: Legacy.Maliev.Intranet.slnx
          use-local-maliev-dependencies: 'true'
      - name: Validate joined customer revision contract
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          dotnet build acceptance/CustomerRevision/CustomerRevision.AcceptanceTests.csproj \
            --configuration Release \
            -p:UseLocalMalievDependencies=true \
            --nologo
          dotnet test acceptance/CustomerRevision/CustomerRevision.AcceptanceTests.csproj \
            --configuration Release \
            --no-build \
            -p:UseLocalMalievDependencies=true \
            --nologo
      - name: Verify compatibility and BFF image restore
        shell: bash
        run: |
          docker build --file Legacy.Maliev.Intranet/Dockerfile --target build --tag legacy-intranet-compatibility-restore:validation .
          docker build --file Legacy.Maliev.Intranet.Bff/Dockerfile --target build --tag legacy-intranet-bff-restore:validation .
      - name: Collect and gate Intranet coverage
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          build_started_utc="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          dotnet build Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -warnaserror \
            -p:EnableCoverageSymbols=true \
            -p:EmitCompilerGeneratedFiles=true
          pwsh -NoProfile -File scripts/verify-coverage-evidence.ps1 \
            -Mode Capture -ExpectedSourceRevision "$(git rev-parse HEAD)" \
            -BuildStartedUtc "$build_started_utc" -ResultsDirectory TestResults/coverage-native
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=coverage.trx" \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory TestResults/coverage-native
          pwsh -NoProfile -File scripts/verify-coverage-evidence.ps1 \
            -Mode Verify -ExpectedSourceRevision "$(git rev-parse HEAD)" \
            -BuildStartedUtc "$build_started_utc" -ResultsDirectory TestResults/coverage-native
          coverage_file="$(find TestResults/coverage-native -name coverage.cobertura.xml -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "The Intranet coverage collector did not produce coverage.cobertura.xml." >&2
            exit 1
          fi
          pwsh -NoProfile -File scripts/verify-test-coverage.ps1 -CoverageFile "$coverage_file"
      - name: Preserve actual runner validation evidence
        if: always()
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/preserve-validation-evidence@45ced0919a604459c7bb5baf7f38d7bc53d708ba
        with:
          results-directory: TestResults
          production-projects: |
            Legacy.Maliev.Intranet.Bff
            Legacy.Maliev.Intranet.Server
            Legacy.Maliev.Intranet.Contracts
