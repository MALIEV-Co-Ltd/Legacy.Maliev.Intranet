name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
      TASK4_INTERACTIVE_ASSET_ROOT: ${{ github.workspace }}/.customer-documents-published/wwwroot
      TASK4_BROWSER_EVIDENCE: ${{ github.workspace }}/TestResults/customer-documents-switch/evidence
    steps:
      - name: Check out Intranet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact CustomerService revision contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CustomerService
          ref: cebf45e8e1eeb600d760a565f8b0970c7f434148
          path: .dependencies/Legacy.Maliev.CustomerService
          persist-credentials: false
      - name: Check out exact AuthService login contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          ref: 8319b23e8ffab0c85b66c886a0109f7dac034c6f
          path: .dependencies/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Verify exact Customers validation dependency identities
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .dependencies/Legacy.Maliev.ServiceDefaults rev-parse HEAD)" = 7edcd961024868513fd5f373cab3dcb261197f77
          test "$(git -C .dependencies/Legacy.Maliev.CompatibilityContracts rev-parse HEAD)" = 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          test "$(git -C .dependencies/Legacy.Maliev.CustomerService rev-parse HEAD)" = cebf45e8e1eeb600d760a565f8b0970c7f434148
          test "$(git -C .dependencies/Legacy.Maliev.AuthService rev-parse HEAD)" = 8319b23e8ffab0c85b66c886a0109f7dac034c6f
      - name: Verify Docker integration-test runtime
        run: docker info
      - name: Verify bounded browser installer source controls
        timeout-minutes: 2
        shell: bash
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/intranet-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 -B -c "from pathlib import Path; files=[Path('scripts/verify-playwright-cache.py'),Path('scripts/test_verify_playwright_cache.py')]; [compile(p.read_text(),str(p),'exec') for p in files]"
          python3 -B -m unittest discover -s scripts -p 'test_verify_playwright_cache.py'
      - name: Restore BrowserTests packages
        timeout-minutes: 6
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          timeout --signal=TERM --kill-after=20s 5m dotnet restore Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj -p:UseLocalMalievDependencies=true
      - name: Build BrowserTests Release with zero warnings
        timeout-minutes: 9
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          timeout --signal=TERM --kill-after=20s 8m dotnet build Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --configuration Release --no-restore --warnaserror -p:UseLocalMalievDependencies=true
      - name: Read exact built Playwright browser revisions
        id: playwright_metadata
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B scripts/verify-playwright-cache.py \
            --package Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/.playwright/package \
            --project Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore exact-version Playwright browser cache
        timeout-minutes: 3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright_metadata.outputs.host-platform }}-${{ steps.playwright_metadata.outputs.package-version }}-${{ steps.playwright_metadata.outputs.driver-version }}-${{ steps.playwright_metadata.outputs.browser-fingerprint }}
      - name: Install Chromium operating-system dependencies
        timeout-minutes: 6
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=20s 5m pwsh -NoProfile \
            -File Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/playwright.ps1 install-deps chromium
      - name: Verify cached browser executables and versions
        id: playwright_cache
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B scripts/verify-playwright-cache.py \
            --package Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/.playwright/package \
            --project Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --cache "$PLAYWRIGHT_BROWSERS_PATH" --cache-parent "$RUNNER_TEMP" \
            --discard-invalid --github-output "$GITHUB_OUTPUT"
      - name: Download exact Playwright Chromium when cache is invalid or absent
        if: steps.playwright_cache.outputs.valid != 'true'
        timeout-minutes: 6
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=20s 5m pwsh -NoProfile \
            -File Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Require valid browser executables before browser regressions
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B scripts/verify-playwright-cache.py \
            --package Legacy.Maliev.Intranet.BrowserTests/bin/Release/net10.0/.playwright/package \
            --project Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --cache "$PLAYWRIGHT_BROWSERS_PATH" --require
      - name: Publish isolated Documents WASM fixture for focused and full browser validation
        timeout-minutes: 9
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          timeout --signal=TERM --kill-after=20s 8m dotnet publish \
            tests/fixtures/customer-documents-interactive/CustomerDocuments.InteractiveFixture.csproj \
            --configuration Release --warnaserror -m:1 \
            -p:UseLocalMalievDependencies=true -p:UseSharedCompilation=false \
            -p:RestorePackagesWithLockFile=true \
            --output .customer-documents-published
          test -f "$TASK4_INTERACTIVE_ASSET_ROOT/index.html"
          test -f "$TASK4_INTERACTIVE_ASSET_ROOT/_framework/blazor.webassembly.js"
      - name: Retain generated Documents fixture dependency lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: customer-documents-fixture-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/fixtures/customer-documents-interactive/packages.lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose exact ten Documents interactive cases before full validation
        timeout-minutes: 5
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          mkdir -p "$TASK4_BROWSER_EVIDENCE"
          timeout --signal=TERM --kill-after=20s 4m dotnet test \
            Legacy.Maliev.Intranet.BrowserTests/Legacy.Maliev.Intranet.BrowserTests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter 'FullyQualifiedName~CustomerDocumentsCustomerSwitchBrowserTests|FullyQualifiedName~CustomerDocumentsLifecycleBrowserTests' \
            --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none \
            --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=customer-documents-switch.trx' \
            --results-directory TestResults/customer-documents-switch
          python3 -B -c 'import xml.etree.ElementTree as E; r=E.parse("TestResults/customer-documents-switch/customer-documents-switch.trx").getroot(); ns={"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}; c=r.find("t:ResultSummary/t:Counters",ns); assert c is not None and all(c.get(k)==v for k,v in {"total":"10","executed":"10","passed":"10","failed":"0","notExecuted":"0"}.items()), E.tostring(r,encoding="unicode")[-4000:]'
      - name: Retain Documents switch failure and success diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: customer-documents-switch-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/customer-documents-switch/
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnose current-main pooled lifecycle and order presentation
        id: current_main_diagnostics
        timeout-minutes: 20
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          dotnet build Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release -warnaserror -p:UseLocalMalievDependencies=true --nologo
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter 'FullyQualifiedName~PooledTestHostReleaseContractTests|FullyQualifiedName~TestHostLimiterDisposalContractTests|FullyQualifiedName~OrderInitialStatusHttpTests|FullyQualifiedName~HostOwnedTimeProviderTests|FullyQualifiedName~ValidationEvidenceCallerContractTests' \
            --logger 'console;verbosity=normal'
      - name: Capture bounded synthetic pooled-host root metadata after validation failure
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.current_main_diagnostics.outcome == 'failure' }}
        timeout-minutes: 8
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
          GITHUB_ACTIONS: 'false'
          GITHUB_TOKEN: ''
          REVIEWED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/diagnostics/pooled-host-root-evidence.py --self-test
          mkdir -p isolated-pool-results
          python3 scripts/diagnostics/pooled-host-root-evidence.py \
            --workspace "$GITHUB_WORKSPACE" \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --head "$REVIEWED_PR_HEAD" > isolated-pool-results/root-metadata.json
      - name: Preserve allowlisted synthetic pooled-host root metadata only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intranet-isolated-pool-${{ github.sha }}
          path: isolated-pool-results/root-metadata.json
          retention-days: 3
          if-no-files-found: warn
      - name: Require current-main diagnostic regressions
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.current_main_diagnostics.outcome }}
        run: test "$DIAGNOSTIC_OUTCOME" = success
      - name: Verify current candidate formatting before full validation
        timeout-minutes: 8
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          dotnet format Legacy.Maliev.Intranet.slnx --verify-no-changes --no-restore
      - name: Execute employee creation email boundaries before full validation
        timeout-minutes: 8
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          # Reuse the successful strict diagnostic build above. This named
          # regression supplements the unchanged full-suite validation below.
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter 'FullyQualifiedName~EmployeeCreationEmailValidationTests|FullyQualifiedName~EmployeeCreateEmailBoundaryComponentTests|FullyQualifiedName~BffEmployeesCreateContractTests.ProfileEmailStorageBoundary_PreservesAcceptedInputAndRejectsOversizeBeforeDownstreamWrites' \
            --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=employee-creation-email.trx' \
            --results-directory TestResults/employee-creation-email
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@d7efac266bc66273bc45eab583618871292ecbd6
        env:
          # The shared action tests solution projects concurrently by default. Keep the
          # Playwright fixture isolated from the long-running integration test host.
          DOTNET_PROCESSOR_COUNT: '1'
          GITHUB_TOKEN: ${{ github.token }}
        with:
          solution: Legacy.Maliev.Intranet.slnx
          use-local-maliev-dependencies: 'true'
      - name: Validate joined customer revision contract
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          dotnet build acceptance/CustomerRevision/CustomerRevision.AcceptanceTests.csproj \
            --configuration Release \
            -p:UseLocalMalievDependencies=true \
            --nologo
          dotnet test acceptance/CustomerRevision/CustomerRevision.AcceptanceTests.csproj \
            --configuration Release \
            --no-build \
            -p:UseLocalMalievDependencies=true \
            --nologo
      - name: Verify compatibility and BFF image restore
        shell: bash
        run: |
          docker build --file Legacy.Maliev.Intranet/Dockerfile --target build --tag legacy-intranet-compatibility-restore:validation .
          docker build --file Legacy.Maliev.Intranet.Bff/Dockerfile --target build --tag legacy-intranet-bff-restore:validation .
      - name: Collect and gate Intranet coverage
        shell: bash
        run: |
          export GITHUB_ACTIONS=false
          build_started_utc="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          dotnet build Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-incremental \
            -warnaserror \
            -p:EnableCoverageSymbols=true \
            -p:EmitCompilerGeneratedFiles=true
          pwsh -NoProfile -File scripts/verify-coverage-evidence.ps1 \
            -Mode Capture -ExpectedSourceRevision "$(git rev-parse HEAD)" \
            -BuildStartedUtc "$build_started_utc" -ResultsDirectory TestResults/coverage-native
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=coverage.trx" \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory TestResults/coverage-native
          pwsh -NoProfile -File scripts/verify-coverage-evidence.ps1 \
            -Mode Verify -ExpectedSourceRevision "$(git rev-parse HEAD)" \
            -BuildStartedUtc "$build_started_utc" -ResultsDirectory TestResults/coverage-native
          coverage_file="$(find TestResults/coverage-native -name coverage.cobertura.xml -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "The Intranet coverage collector did not produce coverage.cobertura.xml." >&2
            exit 1
          fi
          pwsh -NoProfile -File scripts/verify-test-coverage.ps1 -CoverageFile "$coverage_file"
      - name: Verify Customers private failure proof rejection controls
        shell: bash
        run: python3 -B tests/fixtures/customers-private-failure/test_focus_retainer.py
      - name: Execute actual normal Program Customers private failure regression
        shell: bash
        env:
          DOTNET_PROCESSOR_COUNT: '1'
        run: |
          export GITHUB_ACTIONS=false
          # The reviewed shared action and strict coverage build above must succeed first.
          # Do not replace the full-suite action test command with a filtered invocation.
          test ! -e TestResults/customers-private-failure
          dotnet test Legacy.Maliev.Intranet.Tests/Legacy.Maliev.Intranet.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true -p:EnableCoverageSymbols=true \
            --filter 'FullyQualifiedName~Legacy.Maliev.Intranet.Tests.BffCustomersPrivateFailureObservationTests' \
            --logger 'trx;LogFileName=customers-private-failure.trx' \
            --results-directory TestResults/customers-private-failure
      - name: Verify exact eight actual Customers executions
        id: customers_private_failure_proof
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          FOCUS_RESULTS: ${{ github.workspace }}/TestResults/customers-private-failure
          FOCUS_EVIDENCE: ${{ runner.temp }}/customers-private-failure-evidence
        run: python3 -B scripts/verify-customers-private-failure-focus.py
      - name: Preserve sanitized Customers named proof
        if: ${{ always() && steps.customers_private_failure_proof.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: customers-private-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customers-private-failure-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual runner validation evidence
        if: always()
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/preserve-validation-evidence@45ced0919a604459c7bb5baf7f38d7bc53d708ba
        with:
          results-directory: TestResults
          production-projects: |
            Legacy.Maliev.Intranet.Bff
            Legacy.Maliev.Intranet.Server
            Legacy.Maliev.Intranet.Contracts
