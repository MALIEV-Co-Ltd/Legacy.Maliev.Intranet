name: Joined customer administration acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: customer-administration-producer-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-administration-producer-join:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      LEGACY_DEPLOY_ENABLED: 'false'
    steps:
      - name: Check out exact consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 02377791d346e25216c114522b3bfdb6f0f19a16
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out exact CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact Auth issuer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          # Accepted issuer supplies profile/identity scopes; six relation controls prove missing scopes fail closed.
          ref: f7079f133b1e607b8909636a5114ebccc73b27bc
          path: .dependencies/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Check out exact Customer conditional writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CustomerService
          ref: f80f574354c40e9b67fa26c94a3fead352ad22dd
          path: .dependencies/Legacy.Maliev.CustomerService
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/maliev-intranet-dotnet-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DOTNET_MULTILEVEL_LOOKUP: '0'
        with:
          dotnet-version: 10.0.402
      - name: Verify qualified SDK and shared runtime identity
        shell: bash
        run: |
          expected_root="${RUNNER_TEMP}/maliev-intranet-dotnet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test "$DOTNET_ROOT" = "$expected_root"
          test "$(realpath "$DOTNET_ROOT")" = "$expected_root"
          test -d "$DOTNET_ROOT/shared/Microsoft.NETCore.App/10.0.13"
          test -d "$DOTNET_ROOT/shared/Microsoft.AspNetCore.App/10.0.13"
          unqualified_runtime="$DOTNET_ROOT/shared/Microsoft.NETCore.App/10.0.14"
          test ! -L "$unqualified_runtime"
          # setup-dotnet installs latest LTS alongside the requested SDK; this directory is private to this job.
          if test -d "$unqualified_runtime"; then rm -rf -- "$unqualified_runtime"; fi
          test "$(dotnet --version)" = '10.0.402'
          dotnet --list-runtimes
          test "$(dotnet --list-runtimes | awk '{ print $2 }' | sort -u)" = '10.0.13'
      - name: Verify owned hosted integration runtime
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker info
      - name: Verify immutable producer and dependency identities before build
        run: |
          test "$(git -C .dependencies/Legacy.Maliev.AuthService rev-parse HEAD)" = f7079f133b1e607b8909636a5114ebccc73b27bc
          test "$(git -C .dependencies/Legacy.Maliev.CustomerService rev-parse HEAD)" = f80f574354c40e9b67fa26c94a3fead352ad22dd
          test "$(git -C .dependencies/Legacy.Maliev.ServiceDefaults rev-parse HEAD)" = 02377791d346e25216c114522b3bfdb6f0f19a16
          test "$(git -C .dependencies/Legacy.Maliev.CompatibilityContracts rev-parse HEAD)" = 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
      - name: Build joined project before tests
        run: |
          export GITHUB_ACTIONS=false
          dotnet build acceptance/CustomerAdministrationProducerJoin/CustomerAdministrationProducerJoin.AcceptanceTests.csproj --configuration Release --warnaserror -p:UseLocalMalievDependencies=true --nologo
      - name: Execute real issuer and writers with independent readbacks
        run: |
          export GITHUB_ACTIONS=false
          dotnet test acceptance/CustomerAdministrationProducerJoin/CustomerAdministrationProducerJoin.AcceptanceTests.csproj --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true --logger 'trx;LogFileName=customer-administration-producer-join.trx' --results-directory "$RUNNER_TEMP/customer-administration-producer-join-results" --nologo
      - name: Verify all fourteen actual executions and retain immutable graph
        id: customer_join_proof
        env:
          JOIN_RESULTS: ${{ runner.temp }}/customer-administration-producer-join-results
          JOIN_EVIDENCE: ${{ runner.temp }}/customer-administration-producer-join-evidence
        run: python3 -B acceptance/CustomerAdministrationProducerJoin/verify_join.py
      - name: Preserve sanitized join proof only
        if: ${{ always() && steps.customer_join_proof.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: customer-administration-producer-join-${{ github.run_id }}-${{ github.run_attempt }}
          # Raw TRX, assertion snapshots, stdout and parameters never enter this artifact.
          path: ${{ runner.temp }}/customer-administration-producer-join-evidence/
          if-no-files-found: error
          retention-days: 7
